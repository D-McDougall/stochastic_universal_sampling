[package]
    name         = "stochastic_universal_sampling"
    version      = "1.1.3"
    edition      = "2021"
    rust-version = "1.85"
    description  = "The stochastic universal sampling algorithm for the rand crate."
    categories   = ["algorithms"]
    keywords     = ["random", "sampling"]
    authors      = ["David McDougall <dam1784@rit.edu>"]
    license      = "MIT-0"
    repository   = "https://github.com/D-McDougall/stochastic_universal_sampling.git"

[dependencies]
    rand = "0.10"

[dev-dependencies]
    statrs = "0.19"

[profile.test]
    opt-level = 1
